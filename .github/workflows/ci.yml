name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (0 errors required)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Build-time fail-fast validation (auth.ts) needs NEXTAUTH_SECRET;
      # placeholder only — no real secrets in CI.
      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret
